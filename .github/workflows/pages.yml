# Publishes docs/design (design spec + clickable prototype) to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy design docs

on:
  push:
    branches: [main]
    paths: ['docs/design/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/design
      - id: deployment
        uses: actions/deploy-pages@v4
