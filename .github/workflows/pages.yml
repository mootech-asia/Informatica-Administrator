# Builds the go-admin-ui demo (no backend; recorded API responses) and
# publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions", and allow the
# deploying branch under Settings → Environments → github-pages.
name: Deploy demo

on:
  push:
    branches: [main]
    paths: ['infa/**', 'scripts/setup.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch go-admin-ui and apply INFA patch
        run: scripts/setup.sh frontend
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: go-admin-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build demo
        working-directory: go-admin-ui
        run: |
          # upstream .npmrc points at a mirror in mainland China
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
          node scripts/sync-apps.mjs
          pnpm exec vite build --mode demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: go-admin-ui/dist
      - id: deployment
        uses: actions/deploy-pages@v4
